# Stage-2 multi-task LoRA fine-tune (Google Colab / CUDA)
# Starts from the stage-1 Java2Py merged checkpoint.
model_name: models/java2py_qwen/merged
task: multitask
dataset_path: data/processed/qwen_multitask
output_dir: models/qwen_multitask
device: auto

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

num_train_epochs: 2
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
warmup_ratio: 0.03
weight_decay: 0.01
max_seq_length: 512
fp16: true
bf16: false
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
seed: 42
