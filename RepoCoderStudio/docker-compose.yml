services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      REPOCODER_PROJECT_ROOT: /data
      REPOCODER_ADAPTER_NAME: RepoCoderStudio_RAGAware_LoRA_v1_3_transform
      REPOCODER_AUTO_DOWNLOAD_PUBLIC_REPOS: "true"
    ports:
      - "8000:8000"
    volumes:
      - repocoder-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

volumes:
  repocoder-data:
