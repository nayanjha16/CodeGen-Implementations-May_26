[project]
name = "text2sql-benchmark"
version = "0.1.0"
description = "Multi-LLM text-to-SQL benchmark for CodeGen Capstone Task 2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "sacrebleu>=2.4",
    "bert-score>=0.3.13",
    "sqlglot>=25.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.18"]
hf = ["torch>=2.4", "transformers>=4.44", "peft>=0.12", "accelerate>=0.33", "bitsandbytes>=0.43"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["text2sql"]

[tool.pytest.ini_options]
markers = [
    "needs_model: tests that load a real LLM (slow, skipped by default)",
]
addopts = "-m 'not needs_model'"
