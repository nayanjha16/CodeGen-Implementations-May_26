---
# Git repository cloned onto the VM.
repo_url: "https://github.com/YOUR_ORG/CodeGen-Implementations-May_26.git"
repo_branch: main
repo_dest: /opt/codegen

# Path to hf-deploy inside the cloned repo.
hf_deploy_dir: "{{ repo_dest }}/hf-deploy"
venv_path: /opt/codegen/venv

service_name: hf-deploy
service_user: ubuntu
service_group: ubuntu

# Hugging Face adapter loading (recommended on Oracle — no local checkpoints).
hf_deploy_adapter_source: hub
hf_org: care2achieve
hf_deploy_device: cpu
hf_deploy_eager_load: "true"

# Optional: set for automatic HTTPS via Caddy (DNS A record must point to the VM).
# Leave empty to serve HTTP on port 80 only.
api_domain: ""

# systemd / uvicorn
api_host: "127.0.0.1"
api_port: 8000

# Caddy package repo (official)
caddy_gpg_url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"
caddy_repo_url: "https://dl.cloudsmith.io/public/caddy/stable/deb/ubuntu"
