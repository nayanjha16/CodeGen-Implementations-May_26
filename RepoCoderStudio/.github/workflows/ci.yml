name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-train.txt
      - run: pip install -e . pytest ruff
      - run: ruff check src app scripts tests
      - run: python -m compileall -q src app scripts tests
      - run: pytest

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t repocoder-api .
      - run: docker build -f Dockerfile.train -t repocoder-train .
