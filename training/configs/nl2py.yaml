model_name: Salesforce/codegen-350M-multi
task: nl2py
dataset_path: data/processed/nl2py
output_dir: models/nl2py

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

# Training
num_train_epochs: 3
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
warmup_ratio: 0.03
weight_decay: 0.01
max_seq_length: 512
fp16: true
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
seed: 42
