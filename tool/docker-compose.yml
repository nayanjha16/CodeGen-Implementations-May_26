services:
  postgres:
    image: postgres:16
    container_name: tool-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tend}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tool_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tend} -d ${POSTGRES_ADMIN_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tool_pg_data:
