# ============================================================================
# Training configuration — Rust fine-tuning (Task 4)
# ============================================================================

checkpoint_1_subset:
  approach: "lora"                 # subset run always uses LoRA (fast, cheap)
  num_train_samples: 500
  epochs: 3
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_accumulation_steps: 4
  mixed_precision: "fp16"
  warmup_ratio: 0.06
  weight_decay: 0.01
  eval_steps: 25
  save_steps: 50
  logging_steps: 10
  max_grad_norm: 1.0
  save_total_limit: 2               # disk-space guard: keep only 2 checkpoints + best

checkpoint_2_full:
  approach: "full"                 # primary approach per proposal
  fallback_approach: "lora"        # automatic fallback if OOM / budget exceeded
  epochs: 5
  learning_rate: 2.0e-5
  batch_size: 4
  gradient_accumulation_steps: 8
  mixed_precision: "fp16"
  warmup_ratio: 0.03
  weight_decay: 0.01
  eval_steps: 100
  save_steps: 200
  logging_steps: 20
  max_grad_norm: 1.0
  anti_forgetting_ratio: 0.15
  save_total_limit: 2               # disk-space guard: full-model checkpoints are large

sql_generation:
  eval_batch_size: 50               # execution accuracy is I/O-bound (sqlite), keep modest
  max_examples_per_db: 200          # cap questions per db_id to bound Checkpoint-2 runtime

resume:
  auto_resume: true
  resume_from: "latest"            # "latest" | "best" | explicit checkpoint dir
