models:
  - id: codegen-350m-multi
    hf_repo: Salesforce/codegen-350M-multi
    backend: hf
  - id: codet5p-770m
    hf_repo: Salesforce/codet5p-770m
    tokenizer_repo: models/codet5p-770m-tok
    backend: hf-seq2seq
  - id: qwen3-coder-30b
    mlx_repo: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    hf_repo: Qwen/Qwen3-Coder-30B-A3B-Instruct
    backend: mlx
  - id: deepseek-coder-33b
    mlx_repo: sleepy186247/deepseek-coder-33b-instruct-mlx-4Bit
    hf_repo: deepseek-ai/deepseek-coder-33b-instruct
    backend: mlx
    chat_template: true
  - id: codestral-22b
    mlx_repo: mlx-community/Codestral-22B-v0.1-4bit
    hf_repo: mistralai/Codestral-22B-v0.1
    backend: mlx
    mlx_text_format: true   # tokenizer has no chat_template -> train on raw "text" (matches raw-prompt inference)
scenarios: [zero_shot, one_shot]
datasets: [spider, bird]
evaluation:
  metrics: [ex, ts, ves, component_f1, bleu, bertscore]
  llm_judge_model: qwen3-coder-30b
  sample_size: 200
paths:
  spider_root: data/spider/spider_data
  bird_root: data/bird/dev_20240627
