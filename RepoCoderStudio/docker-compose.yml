services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      REPOCODER_PROJECT_ROOT: /data
      REPOCODER_ADAPTER_NAME: RepoCoderStudio_RAGAware_LoRA_v1_2
      REPOCODER_PROMPT_VERSION: rag_prompt_contract_v1.2
      REPOCODER_TRAINING_MANIFEST_VERSION: training_manifest_rag_v1.2
      REPOCODER_TRAINING_DATASET_FILENAME: task_dataset_rag_grounded.jsonl
      REPOCODER_MAX_CONTEXT_CHARS: "2000"
      REPOCODER_PROFILE: production
      REPOCODER_AUTO_DOWNLOAD_PUBLIC_REPOS: "true"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
