<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RepoCoder Studio — Baseline vs Fine-tuned</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>RepoCoder Studio</h1>
    <p>Baseline (pretrained) vs Fine-tuned (LoRA) — pick a task, provide input, and compare.</p>
    <div id="health-banner" class="banner hidden"></div>
  </header>

  <main>
    <section class="controls">
      <label for="task-select">Task</label>
      <select id="task-select"></select>

      <label for="input-text">Input</label>
      <textarea id="input-text" rows="8" placeholder="Enter natural language, Python, or Java input for the selected task..."></textarea>

      <button id="run-button">Run</button>
    </section>

    <section class="results">
      <div class="result-panel">
        <h2>Baseline (pretrained) output</h2>
        <textarea id="baseline-output" rows="14" readonly></textarea>
        <button id="use-baseline-button">Use this output &rarr; next input</button>
      </div>
      <div class="result-panel">
        <h2>Fine-tuned output</h2>
        <textarea id="finetuned-output" rows="14" readonly></textarea>
        <button id="use-finetuned-button">Use this output &rarr; next input</button>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
