# Qwen2.5-Coder-0.5B-Instruct LoRA fine-tune on combined Java→Python data
# (full AVATAR-TC + ClassEval-T + design_patterns_solid + CoDocBench).
# Google Colab (NVIDIA GPU / CUDA). Prefer A100 40GB or L4 for speed;
# T4 works with smaller batch (override per_device_train_batch_size=4).
model_name: Qwen/Qwen2.5-Coder-0.5B-Instruct
task: java2py
dataset_path: data/processed/java2py_combined
output_dir: models/java2py_qwen
device: auto

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

num_train_epochs: 2
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
warmup_ratio: 0.03
weight_decay: 0.01
max_seq_length: 1024
fp16: true
bf16: false
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
seed: 42
