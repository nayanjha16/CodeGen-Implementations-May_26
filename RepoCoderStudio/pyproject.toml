[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repocoder-studio"
version = "0.4.0"
description = "Validated multilingual code generation with repository-aware retrieval"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[tool.setuptools.packages.find]
include = ["src*", "app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
